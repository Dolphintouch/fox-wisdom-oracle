<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 3 — The Lost Fox Spirits</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Georgia,serif;
  background:black;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:url("level3-fox-spirit-forest.png") center/cover no-repeat;
}

/* NAV BUTTONS */
#navButtons{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  z-index:9999;
  max-width:92vw;
}

.navBtn{
  padding:9px 15px;
  border:none;
  border-radius:25px;
  background:rgba(255,240,170,.96);
  color:#4d3510;
  font-family:Georgia,serif;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 14px gold,0 0 28px rgba(255,220,120,.8);
}

.navBtn:hover{
  filter:brightness(1.08);
  transform:scale(1.03);
}

/* UI */
#ui{
  position:absolute;
  top:15px;
  left:15px;
  color:#fff6c9;
  background:rgba(0,0,0,.55);
  padding:13px 15px;
  border-radius:16px;
  z-index:50;
  box-shadow:0 0 18px rgba(255,230,120,.35);
  line-height:1.55;
}

#hint{
  position:absolute;
  top:15px;
  right:15px;
  color:#fff6c9;
  background:rgba(0,0,0,.55);
  padding:13px 15px;
  border-radius:16px;
  z-index:50;
  box-shadow:0 0 18px rgba(255,230,120,.35);
  line-height:1.45;
  max-width:275px;
  text-align:center;
}

#message{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  color:#fff4c2;
  background:rgba(0,0,0,.62);
  padding:12px 20px;
  border-radius:22px;
  z-index:50;
  max-width:86vw;
  text-align:center;
  box-shadow:0 0 18px rgba(255,230,120,.35);
}

/* PLAYER */
#fairy{
  position:absolute;
  width:170px;
  height:210px;
  left:46vw;
  top:62vh;
  background:url("fairy-idle.png") center/contain no-repeat;
  filter:
    drop-shadow(0 0 12px gold)
    drop-shadow(0 0 24px rgba(255,230,120,.75))
    brightness(1.12);
  z-index:25;
  pointer-events:none;
  transform-origin:center center;
}

/* FOX LEVEL OBJECTS */
#foxDen{
  position:absolute;
  width:190px;
  height:135px;
  object-fit:contain;
  left:70px;
  top:505px;
  z-index:12;
  pointer-events:none;
  filter:
    drop-shadow(0 0 16px rgba(255,200,80,.9))
    brightness(1.02);
}

#lostFox{
  position:absolute;
  width:150px;
  height:105px;
  object-fit:contain;
  z-index:20;
  pointer-events:none;
  filter:
    drop-shadow(0 0 16px rgba(255,190,80,.95))
    drop-shadow(0 0 30px rgba(255,220,120,.7))
    brightness(1.08);
  animation:foxGlow 2.4s ease-in-out infinite alternate;
}

#guardian{
  position:absolute;
  width:440px;
  height:310px;
  object-fit:contain;
  left:50%;
  top:25%;
  transform:translateX(-50%);
  display:none;
  z-index:30;
  pointer-events:none;
  filter:drop-shadow(0 0 34px gold) brightness(1.08);
  animation:guardianRise 1.6s ease forwards;
}

.sparkle{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:gold;
  box-shadow:0 0 14px white;
  animation:sparkleFloat 1s ease-out forwards;
  z-index:45;
  pointer-events:none;
}

.wisdomCard{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,245,205,.96);
  color:#4d3510;
  padding:22px 28px;
  border-radius:26px;
  box-shadow:0 0 35px gold,0 0 65px rgba(255,210,90,.8);
  z-index:6000;
  text-align:center;
  max-width:440px;
}

.wisdomCard h2{
  margin:0 0 10px 0;
}

.wisdomCard button{
  margin-top:12px;
  padding:9px 18px;
  border:none;
  border-radius:20px;
  background:gold;
  color:#4d3510;
  font-weight:bold;
  cursor:pointer;
  font-family:Georgia,serif;
}

@keyframes foxGlow{
  from{transform:translateY(0);opacity:.92}
  to{transform:translateY(-5px);opacity:1}
}

@keyframes sparkleFloat{
  to{transform:translateY(-45px) scale(2);opacity:0}
}

@keyframes guardianRise{
  from{opacity:0;transform:translateX(-50%) translateY(35px) scale(.88)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}

@media(max-width:700px){
  #fairy{
    width:130px;
    height:170px;
  }
  #lostFox{
    width:120px;
    height:85px;
  }
  #foxDen{
    width:145px;
    height:105px;
    left:25px;
    top:520px;
  }
  #guardian{
    width:330px;
    height:230px;
  }
  .navBtn{
    padding:7px 10px;
    font-size:12px;
  }
  #ui,#hint{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="navButtons">
    <button id="foxCardsBtn" class="navBtn" type="button">🦊 Fox Cards</button>
    <button id="fairyGameBtn" class="navBtn" type="button">🧚 Fairy Garden</button>
    <button id="restartBtn" class="navBtn" type="button">🔁 Restart Level 3</button>
  </div>

  <div id="ui">
    Level: 3<br>
    Points: <span id="score">0</span><br>
    Fox Spirits Returned: <span id="foxCount">0</span>/5<br>
    Move: Arrow Keys<br>
    Befriend/Return Fox: F<br>
    <button id="soundBtn" type="button">Sound: Off</button>
  </div>

  <div id="hint">
    <strong>Level 3</strong><br>
    The Lost Fox Spirits<br><br>
    Find one fox spirit at a time.<br>
    Press <strong>F</strong> to befriend it.<br>
    Guide it to the den.<br>
    Press <strong>F</strong> again to return it home.
  </div>

  <img id="foxDen" src="fox-den.png" alt="Fox Den">
  <img id="lostFox" src="lost-fox-spirit.png" alt="Lost Fox Spirit">
  <img id="guardian" src="great-fox-guardian.png" alt="Great Fox Guardian">

  <div id="fairy"></div>
  <div id="message">Level 3 — The Lost Fox Spirits. Walk near the fox and press F.</div>

</div>

<script>
const game = document.getElementById("game");
const fairy = document.getElementById("fairy");
const lostFox = document.getElementById("lostFox");
const foxDen = document.getElementById("foxDen");
const guardian = document.getElementById("guardian");
const message = document.getElementById("message");
const scoreBox = document.getElementById("score");
const foxCountBox = document.getElementById("foxCount");
const soundBtn = document.getElementById("soundBtn");

let x = window.innerWidth * 0.47;
let y = window.innerHeight * 0.62;
let facing = 1;
let score = 0;
let rescuedCount = 0;
let foxFollowing = false;
let levelComplete = false;
let foxFrameIndex = 0;
let soundOn = false;

const foxGoal = 5;

const fairySprites = {
  idle:"fairy-idle.png",
  run:"fairy-run.png",
  fly:"fairy-fly.png"
};

const foxWalkFrames = [
  "fox-spirit-walk-1.png",
  "fox-spirit-walk-2.png",
  "fox-spirit-walk-3.png"
];

const foxPositions = [
  {x:1180,y:520},
  {x:510,y:415},
  {x:920,y:610},
  {x:1320,y:430},
  {x:720,y:500}
];

const wisdomMessages = [
  {title:"Trust Your Instincts", text:"The path may be hidden, but your heart remembers the way."},
  {title:"Follow Hidden Paths", text:"The smallest trail may lead to the greatest treasure."},
  {title:"Patience Reveals Truth", text:"The fox waits because wisdom often arrives quietly."},
  {title:"Walk Between Worlds", text:"Not all journeys are seen by the eyes."},
  {title:"Return to Your Inner Den", text:"Home is the quiet place inside you where your spirit feels safe."}
];

const sounds = {
  sparkle:new Audio("magic-sparkle.mp3"),
  bloom:new Audio("plant-bloom.mp3"),
  music:new Audio("fairy-music.mp3")
};

sounds.music.loop = true;
sounds.music.volume = 0.10;
sounds.sparkle.volume = 0.08;
sounds.bloom.volume = 0.16;

function update(){
  x = Math.max(0, Math.min(window.innerWidth - fairy.offsetWidth, x));
  y = Math.max(0, Math.min(window.innerHeight - fairy.offsetHeight, y));

  fairy.style.left = x + "px";
  fairy.style.top = y + "px";
  fairy.style.transform = `scaleX(${facing})`;

  if(foxFollowing){
    const foxX = parseFloat(lostFox.style.left) || 0;
    const foxY = parseFloat(lostFox.style.top) || 0;
    const targetX = x - 105;
    const targetY = y + fairy.offsetHeight * .48;

    const newX = foxX + (targetX - foxX) * .12;
    const newY = foxY + (targetY - foxY) * .12;

    lostFox.style.left = newX + "px";
    lostFox.style.top = newY + "px";
  }
}

function setFairySprite(src){
  fairy.style.backgroundImage = `url("${src}")`;
}

function moveFairy(dx,dy,sprite){
  if(levelComplete) return;
  if(dx > 0) facing = 1;
  if(dx < 0) facing = -1;

  x += dx;
  y += dy;

  setFairySprite(sprite);
  update();
}

function distanceToPlayer(px,py){
  const fx = x + fairy.offsetWidth * .5;
  const fy = y + fairy.offsetHeight * .55;
  const dx = fx - px;
  const dy = fy - py;
  return Math.sqrt(dx*dx + dy*dy);
}

function sparkleAt(px,py){
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = px + "px";
  s.style.top = py + "px";
  game.appendChild(s);
  setTimeout(()=>s.remove(),1000);
}

function manySparkles(px,py,count=14){
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      sparkleAt(px + Math.random()*120 - 60, py + Math.random()*90 - 45);
    },i*45);
  }
}

function playBloom(){
  if(!soundOn) return;
  try{
    const s = sounds.bloom.cloneNode();
    s.volume = 0.16;
    s.play().catch(()=>{});
  }catch(e){}
}

function placeNextFox(){
  if(rescuedCount >= foxGoal){
    completeLevel();
    return;
  }

  const pos = foxPositions[rescuedCount % foxPositions.length];
  lostFox.src = "lost-fox-spirit.png";
  lostFox.style.display = "block";
  lostFox.style.left = pos.x + "px";
  lostFox.style.top = pos.y + "px";
  foxFollowing = false;

  message.innerText = "A lost fox spirit waits in the forest. Walk near it and press F.";
}

function handleFoxAction(){
  if(levelComplete){
    message.innerText = "The Great Fox Guardian has blessed the forest.";
    return;
  }

  const foxX = parseFloat(lostFox.style.left) || 0;
  const foxY = parseFloat(lostFox.style.top) || 0;

  if(!foxFollowing){
    const d = distanceToPlayer(foxX + 75, foxY + 55);
    if(d > 210){
      message.innerText = "Move closer to the lost fox spirit, then press F.";
      return;
    }

    foxFollowing = true;
    lostFox.src = foxWalkFrames[0];
    manySparkles(foxX + 75, foxY + 55, 12);
    playBloom();
    message.innerText = "The fox spirit trusts you. Guide it to the glowing den and press F.";
    return;
  }

  const denX = foxDen.offsetLeft;
  const denY = foxDen.offsetTop;
  const dDen = distanceToPlayer(denX + 95, denY + 70);

  if(dDen > 260){
    message.innerText = "Lead the fox spirit to the den on the left, then press F.";
    return;
  }

  returnFoxHome();
}

function returnFoxHome(){
  foxFollowing = false;
  rescuedCount++;
  score += 40;

  lostFox.src = "fox-spirit-happy.png";
  lostFox.style.left = (foxDen.offsetLeft + 30) + "px";
  lostFox.style.top = (foxDen.offsetTop + 24) + "px";

  scoreBox.innerText = score;
  foxCountBox.innerText = rescuedCount;

  manySparkles(foxDen.offsetLeft + 100, foxDen.offsetTop + 70, 20);
  playBloom();

  showWisdomCard(rescuedCount - 1);

  if(rescuedCount >= foxGoal){
    setTimeout(completeLevel,1100);
  }else{
    setTimeout(()=>{
      placeNextFox();
    },1800);
  }
}

function showWisdomCard(index){
  const w = wisdomMessages[index % wisdomMessages.length];

  const card = document.createElement("div");
  card.className = "wisdomCard";
  card.innerHTML = `
    <h2>🦊 ${w.title}</h2>
    <p>${w.text}</p>
    <button type="button">Continue</button>
  `;

  game.appendChild(card);

  const btn = card.querySelector("button");
  btn.onclick = ()=>card.remove();

  setTimeout(()=>{
    if(card.parentNode) card.remove();
  },4300);
}

function completeLevel(){
  if(levelComplete) return;
  levelComplete = true;
  foxFollowing = false;

  lostFox.style.display = "none";
  guardian.style.display = "block";

  score += 150;
  scoreBox.innerText = score;

  manySparkles(window.innerWidth*.5, window.innerHeight*.43, 55);
  playBloom();

  message.innerText = "The Great Fox Guardian appears. You returned the lost fox spirits home.";

  const card = document.createElement("div");
  card.className = "wisdomCard";
  card.innerHTML = `
    <h2>✨ Level 3 Complete ✨</h2>
    <p>You returned the lost fox spirits to their den.<br>The Great Fox Guardian opens the path to the Fox Wisdom Oracle.</p>
    <button id="goCards" type="button">🦊 Fox Cards</button>
  `;
  game.appendChild(card);

  document.getElementById("goCards").onclick = ()=>{
    window.location.href = "https://dolphintouch.github.io/fox-wisdom-oracle/";
  };
}

function restartLevel(){
  score = 0;
  rescuedCount = 0;
  foxFollowing = false;
  levelComplete = false;
  guardian.style.display = "none";
  scoreBox.innerText = "0";
  foxCountBox.innerText = "0";
  document.querySelectorAll(".wisdomCard,.sparkle").forEach(el=>el.remove());
  x = window.innerWidth * 0.47;
  y = window.innerHeight * 0.62;
  setFairySprite(fairySprites.idle);
  update();
  placeNextFox();
}

document.addEventListener("keydown",e=>{
  if(e.key === "ArrowRight"){
    e.preventDefault();
    moveFairy(16,0,fairySprites.run);
  }
  if(e.key === "ArrowLeft"){
    e.preventDefault();
    moveFairy(-16,0,fairySprites.run);
  }
  if(e.key === "ArrowUp"){
    e.preventDefault();
    moveFairy(0,-16,fairySprites.fly);
  }
  if(e.key === "ArrowDown"){
    e.preventDefault();
    moveFairy(0,16,fairySprites.fly);
  }
  if(e.key.toLowerCase() === "f"){
    e.preventDefault();
    handleFoxAction();
  }
});

document.addEventListener("keyup",()=>{
  if(!levelComplete){
    setFairySprite(fairySprites.idle);
    update();
  }
});

setInterval(()=>{
  if(!foxFollowing || levelComplete) return;
  foxFrameIndex = (foxFrameIndex + 1) % foxWalkFrames.length;
  lostFox.src = foxWalkFrames[foxFrameIndex];
},260);

soundBtn.onclick = ()=>{
  soundOn = !soundOn;
  soundBtn.innerText = soundOn ? "Sound: On" : "Sound: Off";

  if(soundOn){
    try{
      sounds.music.currentTime = 0;
      sounds.music.play().catch(()=>{});
    }catch(e){}
    message.innerText = "Sound is on. Find the lost fox spirit.";
  }else{
    try{ sounds.music.pause(); }catch(e){}
    message.innerText = "Sound is off.";
  }
};

document.getElementById("foxCardsBtn").onclick = ()=>{
  window.location.href = "https://dolphintouch.github.io/fox-wisdom-oracle/";
};

document.getElementById("fairyGameBtn").onclick = ()=>{
  window.location.href = "fairy-garden.html";
};

document.getElementById("restartBtn").onclick = ()=>{
  restartLevel();
};

window.addEventListener("resize",update);

setFairySprite(fairySprites.idle);
restartLevel();
</script>

</body>
</html>
