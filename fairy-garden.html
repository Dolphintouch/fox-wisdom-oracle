<html>
<head>

<body>

<div id="game">
  <div id="fairy"></div>

  <div id="message">Choose your path...</div>
  <button id="singBtn">✨ Sing ✨</button>
</div>

<!-- START SCREEN -->
<div id="startScreen">
  <div id="characterChoice">

    <button class="startBtn" onclick="startGame('fairy')">
      <img id="fairyStartImg" class="startImg">
      Play as Fairy
    </button>

    <button class="startBtn" onclick="startGame('elf')">
      <img id="elfStartImg" class="startImg">
      Play as Elf
    </button>

  </div>
</div>

<script>

/* ===== CLEAN IMAGE FUNCTION (FIXES WHITE BACKGROUND) ===== */
const cache = {};

function cleanWhiteBackground(src){
  return new Promise(resolve=>{
    if(cache[src]) return resolve(cache[src]);

    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement("canvas");
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext("2d");
      ctx.drawImage(img,0,0);

      const data = ctx.getImageData(0,0,c.width,c.height);
      for(let i=0;i<data.data.length;i+=4){
        let r=data.data[i],g=data.data[i+1],b=data.data[i+2];
        if(r>230 && g>230 && b>230){
          data.data[i+3]=0;
        }
      }
      ctx.putImageData(data,0,0);
      const cleaned = c.toDataURL();
      cache[src]=cleaned;
      resolve(cleaned);
    };
    img.src=src;
  });
}

/* ===== SET START IMAGES ===== */
function setupStartImages(){
  cleanWhiteBackground("fairy-idle.png").then(img=>{
    document.getElementById("fairyStartImg").src = img;
  });

  cleanWhiteBackground("elf-idle.png").then(img=>{
    document.getElementById("elfStartImg").src = img;
  });
}

/* ===== START GAME (FIXED) ===== */
let currentCharacter = "fairy";

function startGame(char){
  currentCharacter = char;

  const start = document.getElementById("startScreen");
  start.style.display = "none";

  if(char === "elf"){
    cleanWhiteBackground("elf-idle.png").then(img=>{
      document.getElementById("fairy").style.backgroundImage = `url(${img})`;
    });
  }else{
    document.getElementById("fairy").style.backgroundImage = "url('fairy-idle.png')";
  }

  document.getElementById("message").innerText = "Sing to grow life...";
}

/* ===== BASIC GAME LOOP ===== */
document.getElementById("singBtn").onclick = ()=>{
  document.getElementById("message").innerText = "✨ Magic flows...";
};

/* ===== INIT ===== */
setTimeout(setupStartImages, 200);

</script>

</body>
</html>
