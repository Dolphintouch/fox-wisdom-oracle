<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairy Garden Keeper</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Georgia, serif;
  background:black;
}

#game{
  width:100vw;
  height:100vh;
  background:url("level1-whispering-meadow.png") center/cover no-repeat;
  position:relative;
  overflow:hidden;
}

/* START SCREEN */
#startScreen{
  position:absolute;
  inset:0;
  background:url("fairy-start.png") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:55px;
  z-index:100;
  transition:opacity 1.2s ease;
  overflow:hidden;
}

#startScreen::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(255,230,150,0.20), transparent 45%),
    rgba(0,0,0,0.10);
  pointer-events:none;
}

#characterChoice{
  position:relative;
  z-index:10;
  display:flex;
  gap:18px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
}

.characterBtn{
  width:150px;
  min-height:170px;
  border:none;
  border-radius:28px;
  background:rgba(255,240,170,0.86);
  box-shadow:
    0 0 16px gold,
    0 0 35px rgba(255,230,120,0.75);
  cursor:pointer;
  font-family:Georgia, serif;
  color:#4d3510;
  font-weight:bold;
  font-size:17px;
  padding:10px;
  transition:transform .25s ease, box-shadow .25s ease;
}

.characterBtn:hover{
  transform:scale(1.06);
  box-shadow:
    0 0 22px gold,
    0 0 45px rgba(255,240,150,0.95);
}

.characterPreview{
  width:105px;
  height:115px;
  margin:0 auto 8px auto;
  object-fit:contain;
  display:block;
  filter:
    drop-shadow(0 0 10px gold)
    brightness(1.08);
}

/* PLAYER */
#fairy{
  position:absolute;
  width:220px;
  height:260px;
  background:url("fairy-idle.png") center/contain no-repeat;
  background-color:transparent;
  filter:
    drop-shadow(0 0 12px gold)
    drop-shadow(0 0 24px rgba(255,230,120,.75))
    brightness(1.12)
    contrast(1.15);
  z-index:10;
  pointer-events:none;
  transform-origin:center center;
}

#fairy.singing{
  filter:
    drop-shadow(0 0 18px gold)
    drop-shadow(0 0 35px rgba(255,240,150,.95))
    brightness(1.25)
    contrast(1.18);
}

/* UI */
#ui{
  position:absolute;
  top:15px;
  left:15px;
  color:#fff6c9;
  background:rgba(0,0,0,.5);
  padding:12px;
  border-radius:15px;
  z-index:30;
  box-shadow:0 0 18px rgba(255,230,120,.35);
  line-height:1.5;
}

#message{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.5);
  padding:12px 20px;
  border-radius:20px;
  color:#fff4c2;
  z-index:30;
  text-align:center;
  max-width:86vw;
  box-shadow:0 0 18px rgba(255,230,120,.35);
}

#singBtn{
  position:absolute;
  right:20px;
  bottom:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:gold;
  font-weight:bold;
  cursor:pointer;
  z-index:30;
  box-shadow:0 0 18px gold;
}

button{
  font-family:Georgia, serif;
}

/* PLANTING LEDGE EDIT MODE */
.plantSpot{
  position:absolute;
  width:90px;
  height:16px;
  border-radius:20px;
  background:rgba(255,235,120,.25);
  border:1px solid rgba(255,245,170,.65);
  box-shadow:0 0 14px rgba(255,230,120,.65);
  z-index:6;
  pointer-events:none;
}

.plantSpot.hidden{
  display:none;
}

.plantSpot::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:12px;
  height:12px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,245,170,.8);
  box-shadow:0 0 14px gold;
}

#editNotice{
  position:absolute;
  top:15px;
  right:15px;
  z-index:60;
  color:#fff6c9;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:15px;
  box-shadow:0 0 18px rgba(255,230,120,.45);
  display:none;
}



.plantedItem{
  position:absolute;
  object-fit:contain;
  pointer-events:none;
  animation:plantGrow .8s ease forwards;
  z-index:7;
}

.plantImage,
.fernImage,
.treeImage{
  position:absolute;
  object-fit:contain;
  pointer-events:none;
  animation:plantGrow .8s ease forwards;
  z-index:7;
}

.plantImage{
  width:115px;
  height:115px;
  filter:
    drop-shadow(0 0 12px rgba(255,230,120,.9))
    brightness(1.05);
}

.fernImage{
  width:135px;
  height:135px;
  filter:
    drop-shadow(0 0 12px rgba(180,255,150,.85))
    brightness(1.05);
}

.treeImage{
  width:190px;
  height:230px;
  filter:
    drop-shadow(0 0 16px rgba(255,230,120,.95))
    brightness(1.04);
}

/* MAGIC EFFECTS */
.sparkle{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:gold;
  box-shadow:0 0 14px white;
  animation:sparkleFloat 1s ease-out forwards;
  z-index:20;
}

.note{
  position:absolute;
  font-size:32px;
  color:#fff6a8;
  text-shadow:0 0 12px gold;
  animation:noteFloat 1.6s ease-out forwards;
  z-index:20;
}

.particle{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff6a8;
  box-shadow:0 0 10px gold, 0 0 20px white;
  animation:floatUp 2s ease-out forwards;
  pointer-events:none;
  z-index:20;
}

.fairyAura{
  position:absolute;
  width:150px;
  height:65px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,240,150,0.5), transparent 70%);
  filter:blur(6px);
  pointer-events:none;
  animation:auraFade 1.2s ease-out forwards;
  z-index:8;
}

.plantFallback{
  position:absolute;
  font-size:58px;
  filter:drop-shadow(0 0 14px #eaff8a);
  animation:plantGrow .8s ease forwards;
  z-index:7;
}

.plantImage,
.fernImage,
.treeImage{
  position:absolute;
  object-fit:contain;
  pointer-events:none;
  animation:plantGrow .8s ease forwards;
  z-index:7;
}

.plantImage{
  width:115px;
  height:115px;
  filter:
    drop-shadow(0 0 12px rgba(255,230,120,.9))
    brightness(1.05);
}

.fernImage{
  width:135px;
  height:135px;
  filter:
    drop-shadow(0 0 12px rgba(180,255,150,.85))
    brightness(1.05);
}

.treeImage{
  width:190px;
  height:230px;
  filter:
    drop-shadow(0 0 16px rgba(255,230,120,.95))
    brightness(1.04);
}

.bird{
  position:absolute;
  font-size:34px;
  animation:birdFloat 3s ease forwards;
  z-index:18;
}

.firefly{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff6a8;
  box-shadow:0 0 12px gold, 0 0 25px #fff6a8;
  animation:floatFirefly linear infinite;
  opacity:0.8;
  z-index:5;
}

@keyframes sparkleFloat{
  to{transform:translateY(-45px) scale(2);opacity:0}
}

@keyframes noteFloat{
  to{transform:translateY(-90px);opacity:0}
}

@keyframes floatUp{
  0%{transform:translateY(10px);opacity:0}
  30%{opacity:1}
  100%{transform:translateY(-60px);opacity:0}
}

@keyframes auraFade{
  from{opacity:0.9;transform:scale(0.8)}
  to{opacity:0;transform:scale(1.4)}
}

@keyframes plantGrow{
  from{transform:scale(.2);opacity:.2}
  to{transform:scale(1);opacity:1}
}

@keyframes birdFloat{
  to{transform:translateX(120px) translateY(-20px);opacity:0}
}

@keyframes floatFirefly{
  0%{transform:translateY(40px) translateX(0);opacity:0}
  30%{opacity:1}
  100%{transform:translateY(-110vh) translateX(60px);opacity:0}
}

@media(max-width:700px){
  #fairy{
    width:165px;
    height:205px;
  }

  #message{
    font-size:14px;
    bottom:12px;
  }

  #singBtn{
    right:12px;
    bottom:82px;
  }

  .characterBtn{
    width:135px;
    min-height:155px;
  }

  .characterPreview{
    width:92px;
    height:100px;
  }
}
</style>
</head>

<body>

<div id="game">
  <div id="fairy"></div>

  <div id="ui">
    Points: <span id="score">0</span><br>
    Move: Arrow Keys<br>
    Sing: S or button<br>
    Set ledges: Press L<br>
    <button id="soundBtn">Sound: Off</button>
  </div>

  <div id="message">Choose Fairy or Elf to begin...</div>
  <button id="singBtn">✨ Sing ✨</button>
  <div id="editNotice">Planting Ledge Mode<br>Click = add spot<br>Right-click = remove spot<br>Press L = finish</div>
</div>

<div id="startScreen">
  <div id="characterChoice">
    <button class="characterBtn" id="chooseFairy">
      <img class="characterPreview" id="fairyPreview" src="fairy-idle.png" alt="Fairy">
      Play as Fairy
    </button>

    <button class="characterBtn" id="chooseElf">
      <img class="characterPreview" id="elfPreview" src="elf-idle.png" alt="Elf">
      Play as Elf
    </button>
  </div>
</div>

<script>
const fairy = document.getElementById("fairy");
const game = document.getElementById("game");
const startScreen = document.getElementById("startScreen");
const soundBtn = document.getElementById("soundBtn");
const singBtn = document.getElementById("singBtn");
const scoreBox = document.getElementById("score");
const message = document.getElementById("message");
const elfPreview = document.getElementById("elfPreview");
const editNotice = document.getElementById("editNotice");

let x = window.innerWidth * 0.45;
let y = window.innerHeight * 0.55;
let score = 0;
let soundOn = false;
let singing = false;
let facing = 1;
let currentCharacter = "fairy";

let ledgeEditMode = false;
let plantingSpots = [];
let plantedGrowth = [];

const defaultPlantingSpots = [
  {x:280,y:570},
  {x:390,y:585},
  {x:650,y:720},
  {x:830,y:705},
  {x:1050,y:420},
  {x:1240,y:530},
  {x:1390,y:520}
];

function loadPlantingSpots(){
  try{
    const saved = localStorage.getItem("fairyGardenPlantingSpots");
    plantingSpots = saved ? JSON.parse(saved) : defaultPlantingSpots.slice();
  }catch(e){
    plantingSpots = defaultPlantingSpots.slice();
  }
}

function savePlantingSpots(){
  localStorage.setItem("fairyGardenPlantingSpots", JSON.stringify(plantingSpots));
}

function renderPlantingSpots(){
  document.querySelectorAll(".plantSpot").forEach(s => s.remove());

  plantingSpots.forEach((p, i) => {
    const spot = document.createElement("div");
    spot.className = "plantSpot";
    if(!ledgeEditMode) spot.classList.add("hidden");
    spot.style.left = (p.x - 45) + "px";
    spot.style.top = (p.y - 8) + "px";
    spot.dataset.index = i;
    game.appendChild(spot);
  });
}

function toggleLedgeEditMode(){
  ledgeEditMode = !ledgeEditMode;
  editNotice.style.display = ledgeEditMode ? "block" : "none";
  renderPlantingSpots();

  if(ledgeEditMode){
    message.innerText = "Planting ledge mode is on. Click where plants are allowed to grow.";
  }else{
    savePlantingSpots();
    message.innerText = "Planting ledges saved.";
  }
}


function flashPlantingSpots(){
  document.querySelectorAll(".plantSpot").forEach(s=>{
    s.classList.remove("hidden");
    s.style.opacity="1";
  });

  setTimeout(()=>{
    if(!ledgeEditMode){
      document.querySelectorAll(".plantSpot").forEach(s=>{
        s.classList.add("hidden");
      });
    }
  },1800);
}

function getNearestPlantingSpot(){
  let nearest = null;
  let nearestDistance = 999999;
  const fairyX = x + fairy.offsetWidth * .5;
  const fairyY = y + fairy.offsetHeight * .75;

  plantingSpots.forEach(p => {
    const dx = fairyX - p.x;
    const dy = fairyY - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if(d < nearestDistance){
      nearestDistance = d;
      nearest = p;
    }
  });

  return nearestDistance < 260 ? nearest : null;
}

game.addEventListener("click", e => {
  if(!ledgeEditMode) return;
  const rect = game.getBoundingClientRect();
  plantingSpots.push({x:e.clientX - rect.left, y:e.clientY - rect.top});
  savePlantingSpots();
  renderPlantingSpots();
});

game.addEventListener("contextmenu", e => {
  if(!ledgeEditMode) return;
  e.preventDefault();

  const rect = game.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  let removeIndex = -1;
  let nearestDistance = 999999;

  plantingSpots.forEach((p, i) => {
    const dx = cx - p.x;
    const dy = cy - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if(d < nearestDistance){
      nearestDistance = d;
      removeIndex = i;
    }
  });

  if(removeIndex > -1 && nearestDistance < 80){
    plantingSpots.splice(removeIndex, 1);
    savePlantingSpots();
    renderPlantingSpots();
  }
});

loadPlantingSpots();
renderPlantingSpots();


/*
WHITE BACKGROUND CLEANUP:
This tries to remove white or near-white backgrounds from sprite PNGs in the browser.
It is mainly for your elf images, because they seem to have white baked into the PNG.
If the image file is properly transparent later, this still works fine.
*/
const cleanedSpriteCache = {};

function cleanWhiteBackground(src){
  return new Promise(resolve => {
    if(cleanedSpriteCache[src]){
      resolve(cleanedSpriteCache[src]);
      return;
    }

    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      try{
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = data.data;

        for(let i = 0; i < pixels.length; i += 4){
          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];

          /* remove white / very pale background */
          if(r > 225 && g > 225 && b > 225){
            pixels[i + 3] = 0;
          }

          /* soften light grey background edges */
          if(r > 210 && g > 210 && b > 210){
            pixels[i + 3] = Math.min(pixels[i + 3], 60);
          }
        }

        ctx.putImageData(data, 0, 0);
        const cleaned = canvas.toDataURL("image/png");
        cleanedSpriteCache[src] = cleaned;
        resolve(cleaned);
      } catch(err){
        resolve(src);
      }
    };

    img.onerror = () => resolve(src);
    img.src = src;
  });
}


/* CLEAN ELF PREVIEW ON START SCREEN TOO */
cleanWhiteBackground("elf-idle.png").then(cleaned => {
  elfPreview.src = cleaned;
});

/* SPRITE SETS */
const characterSprites = {
  fairy: {
    idle: "fairy-idle.png",
    run: "fairy-run.png",
    jump: "fairy-jump.png",
    fly: "fairy-fly.png",
    sing: "fairy-fly.png"
  },

  elf: {
    idle: "elf-idle.png",
    run: "elf-run.png",
    jump: "elf-jump.png",
    fly: "elf-jump.png",
    sing: "elf-sing.png",
    collect: "elf-collect.png"
  }
};

function getSprite(action){
  return characterSprites[currentCharacter][action] || characterSprites[currentCharacter].idle;
}

/* SOUNDS */
const sounds = {
  fairy: new Audio("fairy-bells.mp3"),
  grow: new Audio("plant-grow.mp3"),
  bloom: new Audio("plant-bloom.mp3"),
  sparkle: new Audio("magic-sparkle.mp3"),
  music: new Audio("fairy-music.mp3")
};

sounds.music.loop = true;
sounds.music.volume = 0.28;
sounds.fairy.volume = 0.65;
sounds.grow.volume = 0.55;
sounds.bloom.volume = 0.7;
sounds.sparkle.volume = 0.5;

function unlockSounds(){
  Object.values(sounds).forEach(s => {
    s.play().then(() => {
      s.pause();
      s.currentTime = 0;
    }).catch(()=>{});
  });
}

function playSound(s){
  if(!soundOn) return;
  s.currentTime = 0;
  s.play().catch(()=>{});
}

function startMusic(){
  if(!soundOn) return;

  sounds.music.play().then(() => {
    message.innerText = "The meadow is waiting for your song...";
  }).catch(() => {
    message.innerText = "Music could not start. Check fairy-music.mp3 is in the same folder.";
  });
}

async function sprite(img){
  if(currentCharacter === "elf"){
    const cleaned = await cleanWhiteBackground(img);
    fairy.style.backgroundImage = `url("${cleaned}")`;
  } else {
    fairy.style.backgroundImage = `url("${img}")`;
  }
}

function update(){
  x = Math.max(0, Math.min(window.innerWidth - fairy.offsetWidth, x));
  y = Math.max(0, Math.min(window.innerHeight - fairy.offsetHeight, y));

  fairy.style.left = x + "px";
  fairy.style.top = y + "px";
  fairy.style.transform = `scaleX(${facing})`;
}

/* FIREFLIES ON START SCREEN */
for(let i=0;i<25;i++){
  const f=document.createElement("div");
  f.className="firefly";
  f.style.left=Math.random()*100+"vw";
  f.style.top=(80+Math.random()*40)+"vh";
  f.style.animationDuration=(6+Math.random()*6)+"s";
  f.style.animationDelay=(Math.random()*6)+"s";
  startScreen.appendChild(f);
}

/* CHOOSE CHARACTER */
async function chooseCharacter(characterName){
  currentCharacter = characterName;
  localStorage.setItem("fairyGardenCharacter", currentCharacter);

  await sprite(getSprite("idle"));

  soundOn = true;
  soundBtn.innerText = "Sound: On";

  unlockSounds();

  setTimeout(() => {
    playSound(sounds.fairy);
    startMusic();
  }, 200);

  startScreen.style.opacity = "0";
  startScreen.style.pointerEvents = "none";

  setTimeout(() => {
    startScreen.style.display = "none";
    update();
  }, 1000);
}

document.getElementById("chooseFairy").onclick = () => chooseCharacter("fairy");
document.getElementById("chooseElf").onclick = () => chooseCharacter("elf");

const savedCharacter = localStorage.getItem("fairyGardenCharacter");
if(savedCharacter === "fairy" || savedCharacter === "elf"){
  currentCharacter = savedCharacter;
  sprite(getSprite("idle"));
}

/* SOUND BUTTON */
soundBtn.onclick = () => {
  soundOn = !soundOn;
  soundBtn.innerText = soundOn ? "Sound: On" : "Sound: Off";
  unlockSounds();

  if(soundOn){
    startMusic();
    playSound(sounds.fairy);
  } else {
    sounds.music.pause();
    message.innerText = "Sound is off.";
  }
};

/* MAGIC EFFECTS */
function sparkle(){
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = (x + fairy.offsetWidth * .5 + Math.random() * 70 - 35) + "px";
  s.style.top = (y + fairy.offsetHeight * .35 + Math.random() * 70 - 35) + "px";
  game.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

function note(){
  const n = document.createElement("div");
  n.className = "note";
  n.innerHTML = ["♪","♫","♬"][Math.floor(Math.random() * 3)];
  n.style.left = (x + fairy.offsetWidth * .5 + Math.random() * 35) + "px";
  n.style.top = (y + fairy.offsetHeight * .25 + Math.random() * 30) + "px";
  game.appendChild(n);
  setTimeout(() => n.remove(), 1600);
}

function magicSurround(){
  const aura = document.createElement("div");
  aura.className = "fairyAura";
  aura.style.left = (x + fairy.offsetWidth/2 - 75) + "px";
  aura.style.top = (y + fairy.offsetHeight - 20) + "px";
  game.appendChild(aura);
  setTimeout(()=>aura.remove(),1200);

  for(let i=0;i<10;i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = (x + fairy.offsetWidth/2 + (Math.random()*80-40)) + "px";
    p.style.top = (y + fairy.offsetHeight/2 + (Math.random()*60-30)) + "px";
    game.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
}


/* UPLOADED GROWTH IMAGE STAGES */
const plantStages = [
  "plant-stage-1.png",
  "plant-stage-2.png",
  "plant-stage-3.png",
  "plant-stage-4.png"
];

const fernStages = [
  "fern-stage-1.png",
  "fern-stage-2.png",
  "fern-stage-3.png",
  "fern-stage-4.png"
];

const treeStages = [
  "tree-stage-1.png",
  "tree-stage-2.png",
  "tree-stage-3.png"
];


function chooseGrowthType(){
  /*
  This decides what kind of life begins.
  Mostly plants first, then ferns/trees begin appearing later.
  */
  if(score < 40) return "plant";
  if(score < 80) return Math.random() < 0.65 ? "plant" : "fern";
  return Math.random() < 0.45 ? "plant" : Math.random() < 0.75 ? "fern" : "tree";
}

function getStagesForType(type){
  if(type === "fern") return fernStages;
  if(type === "tree") return treeStages;
  return plantStages;
}

function getClassForType(type){
  if(type === "fern") return "fernImage";
  if(type === "tree") return "treeImage";
  return "plantImage";
}

function getTopOffsetForType(type){
  if(type === "tree") return 170;
  if(type === "fern") return 105;
  return 85;
}

async function setCleanImage(imgElement, src){
  /*
  Uses the same cleanup idea as the elf:
  if an image has a white/checker-looking background baked in,
  the browser tries to remove it before showing the sprite.
  */
  const cleaned = await cleanWhiteBackground(src);
  imgElement.src = cleaned;
}

function findPlantedAtSpot(spot){
  return plantedGrowth.find(g => g.spot === spot);
}

async function updatePlantedImage(growth){
  const stages = getStagesForType(growth.type);
  const src = stages[Math.min(growth.stage, stages.length - 1)];

  growth.img.className = "plantedItem " + getClassForType(growth.type);
  await setCleanImage(growth.img, src);

  growth.img.style.left = (growth.spot.x - growth.img.offsetWidth / 2) + "px";
  growth.img.style.top = (growth.spot.y - getTopOffsetForType(growth.type)) + "px";
}

function startGrowthTimer(growth){
  /*
  This is the important change:
  plants do NOT become older because the player keeps singing.
  They grow older over time by themselves.
  */
  growth.timer = setInterval(async () => {
    const stages = getStagesForType(growth.type);

    if(growth.stage < stages.length - 1){
      growth.stage++;
      await updatePlantedImage(growth);
      playSound(growth.stage === stages.length - 1 ? sounds.bloom : sounds.grow);

      if(growth.type === "plant"){
        message.innerText = "A little plant grows older in the meadow...";
      }else if(growth.type === "fern"){
        message.innerText = "A fern slowly unfurls...";
      }else{
        message.innerText = "A young tree reaches toward the light...";
      }
    }else{
      clearInterval(growth.timer);
    }
  }, 5000);
}


function growPlant(){
  const spot = getNearestPlantingSpot();

  if(!spot){
    message.innerText = "Move closer to a glowing planting ledge, then sing again...";
    flashPlantingSpots();
    return;
  }

  const existing = findPlantedAtSpot(spot);

  if(existing){
    message.innerText = "This little one is already growing. Give it time...";
    magicSurround();
    return;
  }

  const type = chooseGrowthType();
  const img = document.createElement("img");
  img.className = "plantedItem " + getClassForType(type);

  const growth = {
    spot: spot,
    type: type,
    stage: 0,
    img: img,
    timer: null
  };

  plantedGrowth.push(growth);
  game.appendChild(img);

  updatePlantedImage(growth);
  startGrowthTimer(growth);

  playSound(sounds.grow);

  if(type === "plant"){
    message.innerText = "A tiny seedling has been planted...";
  }else if(type === "fern"){
    message.innerText = "A curled fern begins to wake...";
  }else{
    message.innerText = "A tiny tree sapling takes root...";
  }
}

function bird(){
  const b = document.createElement("div");
  b.className = "bird";
  b.innerHTML = "🐦";
  b.style.left = (x + fairy.offsetWidth * .45) + "px";
  b.style.top = (y - 45) + "px";
  game.appendChild(b);

  for(let i = 0; i < 4; i++){
    setTimeout(note, i * 300);
  }

  setTimeout(() => b.remove(), 3000);
}

/* SING */
async function sing(){
  if(singing) return;

  singing = true;
  fairy.classList.add("singing");

  await sprite(getSprite("sing"));
  update();

  playSound(sounds.fairy);
  magicSurround();

  score += 10;
  scoreBox.innerText = score;

  for(let i = 0; i < 10; i++){
    setTimeout(sparkle, i * 80);
  }

  for(let i = 0; i < 5; i++){
    setTimeout(note, i * 150);
  }

  setTimeout(() => {
    growPlant();
    playSound(sounds.sparkle);
  }, 350);

  if(score % 20 === 0){
    setTimeout(bird, 700);
  }

  if(score < 40){
    message.innerText = "A tiny song wakes the earth...";
  } else if(score < 80){
    message.innerText = "The plants are growing...";
  } else if(score < 120){
    message.innerText = "The birds are returning...";
  } else {
    message.innerText = "The forest is alive with magic!";
  }

  setTimeout(async () => {
    singing = false;
    fairy.classList.remove("singing");
    await sprite(getSprite("idle"));
    update();
  }, 850);
}

/* MOVEMENT */
async function moveFairy(dx, dy, moveSprite){
  if(dx > 0) facing = 1;
  if(dx < 0) facing = -1;

  x += dx;
  y += dy;

  if(!singing){
    await sprite(moveSprite);
  }

  update();
}

document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight"){
    e.preventDefault();
    moveFairy(16, 0, getSprite("run"));
  }

  if(e.key === "ArrowLeft"){
    e.preventDefault();
    moveFairy(-16, 0, getSprite("run"));
  }

  if(e.key === "ArrowUp"){
    e.preventDefault();
    moveFairy(0, -16, getSprite("fly"));
  }

  if(e.key === "ArrowDown"){
    e.preventDefault();
    moveFairy(0, 16, getSprite("fly"));
  }

  if(e.key.toLowerCase() === "l"){
    e.preventDefault();
    toggleLedgeEditMode();
  }

  if(e.key.toLowerCase() === "s"){
    e.preventDefault();
    sing();
  }
});

document.addEventListener("keyup", () => {
  if(!singing){
    sprite(getSprite("idle"));
    update();
  }
});

singBtn.onclick = sing;

window.addEventListener("resize", update);

document.addEventListener("click", unlockSounds, { once:true });
document.addEventListener("touchstart", unlockSounds, { once:true });

update();
</script>
